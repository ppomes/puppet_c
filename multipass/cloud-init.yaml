#cloud-config
# Cloud-init configuration for puppetc development VM

package_update: true
package_upgrade: false

packages:
  # Build essentials
  - build-essential
  - autoconf
  - automake
  - libtool
  - pkg-config
  - gawk
  # puppetc dependencies
  - libtree-sitter-dev
  - libyaml-dev
  - libssl-dev
  - libmicrohttpd-dev
  - libcurl4-openssl-dev
  - libsqlite3-dev
  - ruby-dev
  # Debian packaging
  - devscripts
  - debhelper
  - dh-autoreconf
  # Testing tools
  - valgrind
  - gdb
  - strace
  # Utilities
  - git
  - curl
  - jq
  - rsync

runcmd:
  - echo "puppetc development VM ready!"
